<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anu Food Point — Hotel Management & Staff Portal</title>
  
  <!-- Website Favicon / Browser Tab Icon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3.9">
  <link rel="alternate icon" href="favicon.svg?v=3.9">
  <link rel="apple-touch-icon" href="favicon.svg?v=3.9">
  <meta http-equiv="refresh" content="0; url=index.html#admin-portal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-card: #171b24;
      --border-color: rgba(255, 255, 255, 0.1);
      --gold-accent: #f59e0b;
      --primary-accent: #e65100;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .portal-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }
    .portal-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary-accent), var(--gold-accent));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      color: #fff;
      margin: 0 auto 1.25rem;
      box-shadow: 0 4px 18px rgba(230, 81, 0, 0.4);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      color: #9ca3af;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-portal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--primary-accent), #cf4400);
      color: #ffffff;
      font-weight: 700;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(230, 81, 0, 0.4);
      transition: all 0.25s ease;
      width: 100%;
    }
    .btn-portal:hover {
      background: linear-gradient(135deg, #ff6d00, var(--primary-accent));
      transform: translateY(-2px);
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #6b7280;
    }
  </style>
  <script>
    window.location.replace("index.html#admin-portal");
  </script>
</head>
<body>
  <div class="portal-card">
    <div class="portal-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1>Anu Food Point Staff Portal</h1>
    <p>Loading secure hotel inventory management, menu updater, and real-time order dashboard...</p>
    <a href="index.html#admin-portal" class="btn-portal">
      <span class="spinner"></span> Open Admin Portal Now
    </a>
    <div class="footer-note">
      Direct staff access • Anu Food Point Cloud Kitchen
    </div>
  </div>
</body>
</html>
